# Key reference: CHEATSHEET.md. Comments here explain why, not what.

###########
# Options #
###########

unbind C-b
set -g prefix C-s
bind C-s send-prefix

set -g mouse on
set -g history-limit 50000

# Neovim re-checks files on focus (autoread), so outside edits reload.
set -g focus-events on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Explicit: tmux infers vi/emacs from $EDITOR at server start, which depends
# on how it was launched. Copy mode vi, prompts emacs (like the shell).
setw -g mode-keys vi
set -g status-keys emacs

# Pass Shift+Enter, Ctrl+Enter, ... through to programs (TERM is xterm-ghostty).
# Indexed instead of `-a` so `prefix R` overwrites rather than appends a duplicate.
set -s extended-keys on
set -s terminal-features[9] 'xterm*:extkeys'

############
# Bindings #
############

bind R source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Splits and new windows open in the current pane's directory.
bind - split-window -v -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Shift+arrow resize (no prefix). Not Ctrl+arrow: macOS uses it for Spaces.
bind -n S-Left  resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Down  resize-pane -D 1
bind -n S-Up    resize-pane -U 1

# Replaces `prefix o` (next pane); C-h/j/k/l cover navigation.
bind o run-shell -b "open #{q:pane_current_path}"

# Copy mode, vim-style. Copies reach the clipboard via OSC 52 (set-clipboard
# defaults to external; Ghostty allows it).
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi / command-prompt -Pi -I "#{pane_search_string}" -T search -p "(search down)" { send -X search-forward-incremental -- "%%" }
bind -T copy-mode-vi ? command-prompt -Pi -I "#{pane_search_string}" -T search -p "(search up)" { send -X search-backward-incremental -- "%%" }

########
# Sesh #
########

# Killing a session switches to another instead of detaching (sesh README).
set -g detach-on-destroy off

# Session picker (sesh README "tmux + fzf", with fzf's native --tmux popup).
# Kept over `sesh picker`: that has no kill (^d) or find-folder (^f) keys.
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf --tmux 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

bind Space run-shell "sesh last"

###########
# fzf-git #
###########

# `prefix G <letter>` (vendored in config/fzf/fzf-git/). G, not the default g:
# tmux 3.8 binds `prefix g` to its floating-pane move menu.
# Read when the bindings are created, so it must come before run-shell.
set -g @fzf-git-key G
run-shell "~/.config/fzf/fzf-git/fzf-git.tmux"

###########
# Plugins #
###########

# TPM, in ~/.config/tmux/plugins (gitignored). Declared here, loaded at the
# very bottom. Above Theme so the bootstrap installs catppuccin before it runs.
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "catppuccin/tmux#v2.3.2"       # pinned tag, per catppuccin README
set -g @plugin "tmux-plugins/tmux-cpu"
set -g @plugin "tmux-plugins/tmux-battery"

# C-h/j/k/l across tmux panes and Neovim splits. Neovim half: config/nvim/lua/plugins/navigation.lua.
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @tmux_navigator_disable_when_zoomed 1 # matches Neovim
set -g @vim_navigator_mapping_prev ""        # no C-\ (left to the shell)

set -g @plugin "Morantron/tmux-fingers"
set -g @fingers-show-copied-notification 1
set -g @fingers-hint-style "fg=colour211,bold" # ~catppuccin red
set -g @fingers-highlight-style "fg=colour222" # ~catppuccin yellow

# First start on a new machine: clone TPM and install the plugins above.
# install_plugins needs TMUX_PLUGIN_MANAGER_PATH, normally set by `run tpm` below.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins/"
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

#########
# Theme #
#########

# Order per catppuccin docs: @catppuccin_* options, load theme, then status
# options. TPM runs last so cpu/battery expand their placeholders.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
run "~/.config/tmux/plugins/tmux/catppuccin.tmux"

# tmux 3.8 underlines the current window tab; catppuccin doesn't reset it.
setw -g window-status-current-style default

set -g status-left ""
set -g status-right-length 100
set -gF status-right "#{E:@catppuccin_status_cpu}" # -F expands now so tmux-cpu can fill it in
set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag status-right "#{E:@catppuccin_status_session}"

# Must be last (TPM requirement).
run "~/.config/tmux/plugins/tpm/tpm"
