# A LOT of the work here is inspired by, and sometimes directly copied from,
# Chris Toomey's dotfiles.

#########################
# General Configuration #
#########################

# Ctrl-s prefix key. Default => C-b
unbind C-b
set -g prefix C-s

# Keybinding to reload the configuration file
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf Reloaded!"

# Change to non zero based window numbering
set -g base-index 1
set -g renumber-windows on

# Change to non zero based window numbering
set -g base-index 1
set -g renumber-windows on

# More colors!
set-option -g default-terminal "screen-256color"
set-option -sa terminal-overrides ',xterm-256color:RGB'

# Increase scrollback lines
set -g history-limit 10000

# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# Open current Path in finder
bind o run-shell "open '#{pane_current_path}'"

# Use emacs / readline key-bindings at the tmux command prompt `<prefix>:`
set -g status-keys emacs

# Use vim key binding on various Tmux modes (like choose-tree)
setw -g mode-keys vi

# Spliting or Creating Pans/Windows
bind - split-window -v  -c '#{pane_current_path}'
bind \\ split-window -h  -c '#{pane_current_path}'
bind c new-window -c "#{pane_current_path}"

# Quick session switching back and forth
bind-key Space switch-client -l

# Open a new session from you current folder. Note it only works when you have at least one extra pane open, as it kills the current tmux session
bind C-b send-keys 'tat && exit' 'C-m'

# Break and Join pane
bind b break-pane -d
bind-key J command-prompt -p "join pane from: "  "join-pane -h -s '%%'"

# Kill current sessions
bind-key ! run-shell '(tmux switch-client -l || tmux switch-client -n) && tmux kill-session -t "#S" || tmux kill-session'

# Show and switch sessions tree
bind-key C-t run-shell "tmux-popup 'tmux-open-session' 100"
bind-key C-j run-shell "tmux-popup 'tmux-switch-session' 100"

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state=,tty=,comm= | grep -iqE '^[^TXZ ]+ +#{s|/dev/||:pane_tty}\s+(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind-key -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi C-\\ select-pane -l

# Fine resizing adjustment (1 or 2 cursor cells per bump)
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Down resize-pane -D 1
bind -n S-Up resize-pane -U 1

# Coarse resizing adjustment (5 or 10 cursor cells per bump)
bind -n C-Left resize-pane -L 10
bind -n C-Right resize-pane -R 10
bind -n C-Down resize-pane -D 5
bind -n C-Up resize-pane -U 5

# Clear pane
bind C-l send-keys 'C-l'

# Use vim keybindings in copy mode
set -g mouse on
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
unbind -T copy-mode-vi Space
bind -T copy-mode-vi Space send -X jump-again
bind-key -T copy-mode-vi 0 send -X back-to-indentation
bind y run 'tmux save-buffer - | pbcopy '
bind C-y run 'tmux save-buffer - | pbcopy '

# Default to incremental search in copy-mode
bind-key  -T copy-mode-vi / command-prompt -i -p "search down" "send -X search-forward-incremental \"%%%\""
bind-key  -T copy-mode-vi ? command-prompt -i -p "search up" "send -X search-backward-incremental "%%%""
bind-key / copy-mode\; command-prompt -i -p "search up" "send -X search-backward-incremental "%%%""

#########
# Theme #
#########

set -g @catppuccin_flavor "mocha"

# Restore default window name
set -g @catppuccin_window_current_text ''
set -g @catppuccin_window_text " #W"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set-window-option -g automatic-rename off

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_battery}"

run ~/.config/tmux/plugins/tmux-plugins/tmux-cpu/cpu.tmux
run ~/.config/tmux/plugins/tmux-plugins/tmux-battery/battery.tmux
